name: Build DarkCalc APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show project structure
        run: |
          echo "===== PROJECT FILES ====="
          find . -maxdepth 8 -type f | sort
          echo "========================="

      - name: Build
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --info 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DarkCalc-build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DarkCalc-debug
          path: app/build/outputs/apk/debug/app-debug.apk